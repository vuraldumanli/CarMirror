name: APK derle
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk EkranYansit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EkranYansit-apk
          path: EkranYansit.apk
      # Telefondan doğrudan indirilebilen sabit link: releases/latest/download/EkranYansit.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ekran Yansıt v1.0.${{ github.run_number }}
          files: EkranYansit.apk
          make_latest: true
